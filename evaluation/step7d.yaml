    detectable_from_diff: "weak"
    label_rationale: >
      Metadata keys and values are concatenated straight into single-quoted OData literals in `formatComparisonFilter`, the one place every comparison funnels through. Interpolation into a quoted literal with no escaping is visible; that the OData grammar requires a single quote to be doubled is a grammar the file does not carry.
    origin_date: "2024-07"
