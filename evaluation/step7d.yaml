# Step 7d — the extension that takes the detection set from 19 scorable cases to 38.
# Frozen before any of its cases was run. `evaluation/step7b.yaml` is NOT altered by this file.
#
# WHY THERE IS A THIRD FREEZE
#
# `step7b.yaml` says it in its own words: "19 scorable cases give roughly +/- 20 points, not the
# +/- 15 that 40 would." Its API pass is bought and reported — 15/19, `docs/step7b-first-run.md`
# — and all 19 have since been replayed on the harness for nothing
# (`docs/transport-calibration-19.md`). Scaling further on the API would cost about $20; on the
# harness a case costs tokens and no dollars, so the scale-up runs there. That is ADR-0005's
# division of labour applied to the measurement rather than to the review.
#
# **The number this produces is a harness number.** On the nineteen cases where both transports
# have now run, they agree on eighteen — much closer than the four-case calibration suggested —
# but "close" is not "transferable", and nothing here assumes a transfer.
#
# WHERE THE NEW CASES COME FROM
#
# **The one tunable, raised — and it was named in writing before any of this.**
# `evaluation/step7-young-repos.md` says of `MAX_FILES_IN_ORIGIN = 10`:
#
#   "in a young, fast-moving project a twelve-file commit is an ordinary feature, and the review
#    unit is one file regardless of how many the commit touched. Raising it would raise the yield.
#    Deciding that after seeing which cases it admits would be the post-hoc adjustment this whole
#    exercise exists to avoid, so it stays at 10 unless it is changed for a stated reason, before
#    any labelling, and recorded here."
#
# It is raised to **20**, for that reason and no other. The condition attached to it is met in
# form: the reason was written before the change, the change is recorded, and the cases it admits
# were labelled blind afterwards.
#
# The condition is **not** met in spirit, and saying so is the point of this paragraph: the bound
# is being raised after the 15/19 result is known. What bounds that is structural — the 24 frozen
# cases are untouched and were rerun unchanged, so a report can show the old subset and the new
# one side by side. If widening the pool moved the number, that will be visible rather than
# absorbed.
#
# A SELECTION THAT DID NOT REPRODUCE, FOUND WHILE DOING THIS
#
# `evaluation/step7-young-repos.md` prints a raw listing of **43 usable candidates**. Today's
# committed `step7_origin.py`, at the same bound of 10, produces **33** (22 langchain4j, 11
# spring-ai). The published listing was printed by a version of the script from before the
# reformatting filter was added, and the document was never regenerated.
#
# **`step7b.yaml` itself is unaffected, and that was checked rather than assumed:** all 24 frozen
# cases still come out of today's script with exactly the origins the freeze records — including
# `840330c24`, whose origin the freeze corrects from the published listing's `fcf18fda1` to
# `9443ad9b2`, which is what the corrected script returns. Zero absent, zero altered.
#
# WHAT IS NOT ALLOWED TO CHANGE, AND DOES NOT
#
#   - the six other selection rules, verbatim from `step7b.yaml`
#   - rule 7, now a committed script (`evaluation/step7_verify.py`) rather than a scratch file
#   - `evaluation/labelling-rubric.md`, unchanged since `a97f883`
#   - the scoring rule: a finding counts only if it anchors at the defect AND its consequence
#     describes the actual failure
#   - every label and every case already in `step7b.yaml`
#
# LABELS are assigned from the ORIGIN diff, never from the fix, taking the lower value where
# torn. `no` cases stay in the set and out of every rate.

schema_version: 1

budget:
  usd: 0.0
  note: >
    **Nothing here is paid for.** Every case runs on the harness transport
    (`rsquad evaluate --jobs <dir> --export/--ingest`), where a case costs tokens against a
    subscription and no dollars. That is the division of labour ADR-0005 records, applied to the
    measurement rather than to the review, and it is the only reason forty cases are affordable:
    on the API this set would have cost roughly $20 on top of the $17.24 `step7b.yaml` already
    spent.

arms:
  - repo: langchain4j/langchain4j
    url: https://github.com/langchain4j/langchain4j.git
    cases: 19
  - repo: spring-projects/spring-ai
    url: https://github.com/spring-projects/spring-ai.git
    cases: 3

selection:
  scan: "python evaluation/step7_origin.py --max-files 20 langchain4j spring-ai"
  verify: "python evaluation/step7_verify.py <scan output>   # rule 7: keep only VERIFIED >= 1"
  candidates_at_bound_20: 67
  passing_rule_7: 51
  already_in_step7b: 24
  new_candidates: 27
  dropped_duplicate_unit: 4
  dropped_rubric_rule_5: 1
  frozen_here: 22

deduplication:
  note: >
    **One case per (origin commit, file).** Two fixes can trace back to the same commit and the
    same file, and the two cases are then the *same review unit*: the squad would be handed an
    identical diff twice and the two outcomes would not be independent. Four such collisions
    appeared in the widened pool and none in `step7b.yaml`, which is itself a consequence of
    raising the bound. The tie is broken mechanically — **keep the case whose fix is newer** —
    and no case was chosen by reading it.
  collisions:
    - unit: ApacheHttpClient.java @ f368ec038
      kept: "e1dc39172"
      dropped: "b44723943"
    - unit: InfinispanMetadataFilterMapper.java @ 1d81014af
      kept: "f00ea5f79"
      dropped: "0d3f1b97b"
    - unit: ElasticsearchContentRetriever.java @ 2c170dd43
      kept: "525273985"
      dropped: "cfd41109c"
    - unit: TencentCosDocumentLoader.java @ e43f86809
      kept: "765b56474"
      dropped: "e4e71560e"

dropped_by_rubric_rule_5:
  - fix: "12f5cbe61"
    repo: spring-ai
    why: >
      the traced line is `return internalStream(requestPrompt, null)`, a prompt-building refactor. The defect the fix addresses is the buffering inside `internalStream`, whose body appears as context in the origin diff, not as an addition. Dropped, not labelled `no` (rubric rule 5).

strata:
  note: >
    `origin_date` stays a covariate reported beside the result, never a filter. Raising the file
    bound admitted larger commits, so this set is **not** distributed like `step7b.yaml`: its
    origin diffs are much bigger and most of them create the file. That is recorded per case as
    `origin_lines` and `origin_creates_file`, and it has to be read with the result, because
    reviewing a whole new class is a different task from reviewing a five-line change.
  post_cutoff_note: >
    **This extension adds no post-cutoff scorable case.** Two candidates have an origin after the
    May 2026 cutoff and both were labelled `no`, so they are out of every rate. The memorisation
    contrast therefore stays exactly where `step7b.yaml` left it — five cases — and nothing in
    this set strengthens or weakens it. Said here rather than discovered later, because the
    strata are the reason the young-repository pool was built at all.
  scorable_by_stratum:
    post-cutoff: 0
    2025-to-2026-05: 14
    2024-and-earlier: 5

labels:
  "yes": 7
  "weak": 12
  "no": 3

cases:

  - id: langchain4j-4a36c67
