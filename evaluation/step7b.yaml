# Step 7b — pre-registered selection on two young repositories. Frozen 2026-08-23, before any
# case was run. **No API pass has been made against this file.**
#
# WHY THERE IS A SECOND FREEZE
#
# `evaluation/step7.yaml` is superseded. Its cases were fix commits replayed backwards, which put
# the correct code on the minus side of every diff (`docs/step7-first-run.md`). Its successor, the
# archaeology on mature libraries, died of three obstacles with one cause — no regressions to
# replay, introductions predating the knowledge cutoff by years, and paths repackaged since. All
# three follow from the repositories being old (`evaluation/step7-pool.md`).
#
# These two are not. Neither has a single case introduced before 2021.
#
# WHAT A CASE IS HERE
#
# The commit under review is the one that **first wrote the buggy line**, found with `git log -L`
# and then verified: the buggy line must appear as an addition in that commit's diff for that
# file. Eight candidates were dropped by that check rather than labelled.
#
# It is not a reverse patch and not a regression. It is the real commit that introduced the
# defect, with unrelated correct code around it — which is the property the reverse patch
# destroyed, and the most realistic target available: a change adding new code is what a pre-push
# review actually sees.
#
# SELECTION, mechanical, by `evaluation/step7_origin.py`. No commit was chosen by reading it.
#
#   1. the FIX is since 2026-05-01 and its message matches a fix vocabulary AND names an issue
#   2. exactly one changed .java outside the test tree, at least one inside it, <= 6 files
#   3. the fix changes at least one line that is not a comment, blank or import
#   4. the fix changes at least one line that is not pure reformatting — see below
#   5. the origin commit touches <= 10 files (not a wholesale import) and did not merely MOVE the
#      line
#   6. today's path resolves AT the origin commit (`git cat-file -e <origin>:<path>`) — checked,
#      never reconstructed
#   7. the buggy line appears as an addition in the origin's diff for that file
#
# Rules 3, 4 and 6 all exist because of the same mistake made three times: **the line being traced
# was not the line that mattered.** First imports and comments were paired against removed code.
# Then reformatting was — these projects run a formatter inside fix commits, so a removed line
# reappears re-wrapped and `git log -L` follows a line nobody edited; on `Utils.java` that traced
# a method signature while the fix was about gzip decoding. Then today's path was used at a commit
# where the file lived elsewhere, which reported "0 lines changed" and read as nothing-to-review.
# Each was found by reading output, never by rereading code.
#
# LABELS were assigned against `evaluation/labelling-rubric.md`, committed first, from the ORIGIN
# diff and never from the fix. Where torn, the lower value was taken.
#
# WHAT THIS CANNOT DO
#
# 19 scorable cases give roughly +/- 20 points, not the +/- 15 that 40 would. The pool shrank at
# every correction, and correcting was right each time.
#
# The Java adapter resolves no context pack (question 6 is unimplemented for Java), so every lens
# runs on the diff and the file alone. Case 16 is labelled `no` explicitly because of it. This
# measures the squad **without** a facility it has on Python.
#
# And the labeller reads the results. Committing the rubric and the labels first bounds that; it
# does not remove it.

schema_version: 1

budget:
  cap_usd_per_arm: 8.0
  hard_bound_usd: 16.0
  expected_usd: 16.0             # 19 scorable cases at the $0.84 measured on Java
  note: >
    One `evaluate` invocation per repository, each with `--max-usd`, so neither arm can starve the
    other. Not yet spent: this file is frozen ahead of any run.
  amendment_2026_08_23: >
    **Raised to $21 after the first pass, on the user's decision, to run the five scorable cases
    the cap had stopped.** Recorded rather than edited in place, because a bound moved after
    seeing results is exactly the drift this file exists to prevent.

    What makes it defensible: the amendment touches the BUDGET only. The selection was mechanical
    and the labels were assigned blind, both committed at 0491ade before any case ran, and
    neither is altered. Running the remaining cases therefore makes the sample MORE faithful to
    the pre-registration, not less — stopping at 14 of 19 left a tail selected by cost, and cost
    tracks the number of findings, which is not independent of the result.

    What would NOT have been defensible, and was not done: adding cases, moving a label, or
    changing the scoring rule.

arms:
  - repo: langchain4j/langchain4j
    url: https://github.com/langchain4j/langchain4j.git
    first_commit: "2023-06"
    cases: 17
  - repo: spring-projects/spring-ai
    url: https://github.com/spring-projects/spring-ai.git
    first_commit: "2023-07"
    cases: 7

strata:
  note: >
    `origin_date` is the memorisation covariate, and it is reported beside the result rather than
    used to exclude. Post-cutoff cases are the only ones whose fixed form the model cannot have
    read. Both repositories populate every stratum, which the mature pool could not do — there
    "recent" was 80 % one repository, so an age contrast would have been a repository contrast.
  scorable_by_stratum:
    post-cutoff: 5               # origin after 2026-05
    2025-to-2026-05: 7
    2024-and-earlier: 7

labels:
  # Quoted, because YAML 1.1 reads bare `yes` and `no` as booleans — the same trap
  # `defects.yaml` already carries a guard test for.
  "yes": 5
  "weak": 14
  "no": 5                        # excluded from every rate, kept as a record of defect shapes

