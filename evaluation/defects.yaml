# Ground truth: real defects, with the commit that introduced each one.
#
# The only non-circular way to know whether a review squad finds anything is to replay it on
# diffs that are known to contain a defect, where the label comes from reality - somebody hit
# the bug and fixed it - rather than from a model's opinion.
#
# HOW BIG THIS IS, AND WHAT IT CANNOT DO
#
# The source project has 52 commits and roughly seven corrections. This set is a SMOKE TEST,
# not a measurement. On ten cases the confidence interval is wide enough that a 40 % detection
# rate and a 70 % one are indistinguishable. It will catch gross blindness - a squad that finds
# nothing, or that only ever finds style - and nothing finer. Reporting a percentage from it
# would repeat exactly the mistake `docs/gate-baseline.md` documents.
#
# A real rate needs an open-source repository with a rich history of issue-linked fixes, ideally
# on a non-Python stack so it validates the adapter protocol at the same time. That is the
# deferred step 7.
#
# `detectable_from_diff` IS THE FIELD THAT MATTERS
#
# Not every real defect is findable by reading the diff that introduced it. A wrong constant
# looks like a right constant; a no-op flag looks like a working flag when the reason it is a
# no-op lives in another file. Scoring a squad against undetectable cases measures nothing and
# makes the squad look worse than it is - the same self-deception, pointed the other way.
#
#   yes    a careful reader of this diff alone should find it
#   weak   findable only as a smell (unexplained magic number, unused assignment)
#   no     needs context outside the diff, or a measurement
#
# Only `yes` and `weak` belong in a detection rate. `no` entries are kept because they document
# what kinds of defect this codebase actually produces, which is what the lenses are shaped
# around.

schema_version: 1

defects:

  - id: head-overwritten-before-use
    summary: >
      `main()` resolves the requested revision, uses it to pick the base and the changed file
      list, then reassigns the same variable to `HEAD` before the work that needs it.
    repo: ai-video-digest
    introduced_in: 2a21282
    fixed_in: f71241e            # in rsquad, not in the source project
    file: tools/portail_tests.py
    kind: correctness
    severity: significant
    replayable: true
    detectable_from_diff: "yes"
    found_by: reading the file line by line to port it
    note: >
      The best case in this set. A variable is assigned, used, then silently reassigned before
      its remaining uses, all inside one short function and all inside one diff. Any lens that
      cannot find this one is not working. It survived two weeks and three readings.

  - id: verdict-depends-on-import-style
    summary: >
      A base failure on a symbol that does not exist yet is classed `valid` when the test
      reaches it as a module attribute and `no signal` when it imports it by name. Same missing
      symbol, verdict decided by how the test spells the import.
    repo: ai-video-digest
    introduced_in: 2a21282
    fixed_in: f71241e            # in rsquad
    file: tools/portail_tests.py
    kind: correctness
    severity: blocking
    replayable: true
    detectable_from_diff: "weak"
    found_by: running the gate on a commit that added a whole new test file
    note: >
      Hard on purpose. Finding it requires knowing that pytest reports an exception in the test
      body as `<failure>` and a collection failure as `<error>`, and then noticing the two carry
      the same meaning here. A lens that gets this is reasoning about the domain, not the text.
      It inflated the tool's reported coverage from 21 % to 47 %.

  - id: words-per-video-invented
    summary: >
      `MOTS_PAR_VIDEO = 2400`, used to price a batch before spending, was a guess. The measured
      median was 3238, so the estimate ran 2.3x low.
    repo: ai-video-digest
    introduced_in: 22a9680
    fixed_in: 108e779
    file: src/avd/__main__.py
    kind: correctness
    severity: significant
    replayable: true
    detectable_from_diff: "weak"
    found_by: measuring the corpus after a batch cost more than announced
    note: >
      A lens cannot know the true median from the diff. It can flag that a magic constant with
      no stated provenance is driving a spend estimate shown to a human before payment, which
      is the actionable half of the finding.

  - id: usd-per-word-underestimate
    summary: >
      `USD_PAR_MOT`, derived from the bench, underestimated the real cost by 59 %.
    repo: ai-video-digest
    introduced_in: 92cf545
    fixed_in: 108e779
    file: src/avd/restructure.py
    kind: correctness
    severity: significant
    replayable: true
    detectable_from_diff: "no"
    found_by: comparing the estimate against the billed amount
    note: >
      Kept as a `no`. The constant is derived from a real measurement on a sample that did not
      generalise; nothing in the diff says so. Scoring a squad on this would be unfair.

  - id: since-flag-never-bit
    summary: >
      `--depuis` filtered on a publication date that `yt-dlp --flat-playlist` never returns
      without `--extractor-args youtubetab:approximate_date`, so the flag silently matched
      everything.
    repo: ai-video-digest
    introduced_in: 22a9680
    fixed_in: 6de3862
    file: src/avd/discover.py
    kind: contract
    severity: significant
    replayable: true
    detectable_from_diff: "weak"
    found_by: a bounded backfill returning far more videos than the bound implied
    note: >
      The comparison is against a field that is always absent. Findable as "this filter reads a
      field nothing in this diff populates", which is a contract finding and does not require
      knowing yt-dlp.
