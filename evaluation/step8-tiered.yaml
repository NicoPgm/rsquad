# Step 8 — the lenses on a smaller model, the refuter on the largest (ADR-0009, step 3).
# Frozen before any of its cases ran.
#
# QUESTION
#
# Do lenses on claude-sonnet-5, refuted by claude-opus-5, detect as many of the frozen 38 cases
# as the all-Opus baseline did (31/38, docs/step7d-forty-cases.md)?
#
# WHAT IS HELD, AND WHAT IS NOT
#
# Held: the 38 scorable cases of evaluation/step7b.yaml and evaluation/step7d.yaml, their labels,
# the scoring rule (a surviving finding at the labelled defect, for the labelled reason), the
# harness transport, the Claude Code batch driver. No context pack — the baseline had none either,
# because Java's was not implemented when it ran.
#
# Changed, all at once, because step 1 of ADR-0009 changed the core before this ran:
#   - lens model: claude-opus-5 -> claude-sonnet-5           (the variable under test)
#   - the `tests` lens no longer reads source files           (4 findings in 190 tasks, baseline)
#   - the refuter may answer `undecided`                      (still a refutation)
# The two others are expected to be small next to the first; the report says which detections
# changed and, for each, whether a `tests` finding or an `undecided` verdict was involved.
#
# DECISION RULE, fixed here
#
# At n = 38 the 95 % interval is about +/- 12 points, roughly four or five cases.
#   - detected >= 29 / 38: no measurable loss. Sonnet becomes the default lens model, the refuter
#     stays on Opus.
#   - detected <= 28 / 38: a loss. Opus stays the default; the report lists the lost cases.
# Either way the case-by-case table against the baseline is published, not only the total.
#
# COST, recorded rather than estimated after the fact
#
# Tokens per agent and agent counts, per round, from the driver's own accounting.

baseline:
  report: docs/step7d-forty-cases.md
  detected: 31
  scorable: 38
  lens_model: claude-opus-5
  refute_model: claude-opus-5

arm:
  lens_model: claude-sonnet-5
  refute_model: claude-opus-5
  context_pack: false
  jobs: evaluation/jobs/s3/   # step7b-langchain4j, step7b-spring-ai, step7d-langchain4j, step7d-spring-ai
  round_1_tasks: 152
