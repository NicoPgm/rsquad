[project]
name = "rsquad"
version = "0.1.0"
description = "A review squad: a mechanical gate, blind lenses, adversarial refutation, a ranked queue."
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "pyyaml>=6.0",
    "jsonschema>=4.20",
]

[project.optional-dependencies]
# The API transport is frozen and optional (ADR-0009): `rsquad review --confirm` and
# `rsquad evaluate --confirm` need it, the harness path does not.
api = ["anthropic>=0.116"]
dev = ["pytest>=8.0", "anthropic>=0.116"]

[project.scripts]
rsquad = "rsquad.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The gate's exemptions (`rsquad gate`): a test that passes before the change on purpose.
markers = [
    "characterization: pins behaviour as it is, so it passes on the base by construction",
    "guard: guards behaviour the change keeps, so it passes on the base by construction",
]
